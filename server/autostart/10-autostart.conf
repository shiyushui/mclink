# McLink 开机自启加固
# ============================================================
# 这是一个 systemd drop-in，**不会改动 /etc/systemd/system/mclink.service**，
# 只在此基础上追加/覆盖设置。别人的修改不会被覆盖。
#
# 原始 unit 已经 enable 了（WantedBy=multi-user.target），开机本来就会启动。
# 这里只补一个真正关键的设置：
#
#   StartLimitIntervalSec=0
#
# systemd 默认是「10 秒内失败 5 次就永久放弃」——开机那一刻网络、磁盘、
# DNS 往往还没完全就绪，连续失败几次很正常，一旦命中限制服务就会一直
# 躺在 failed 状态再也不起来，表现就是「重启后服务没起来」。
# 设成 0 = 永不放弃，一直按 RestartSec 重试到成功为止。
#
# 想彻底不用它：删掉 /etc/systemd/system/mclink.service.d/10-autostart.conf
# 然后 systemctl daemon-reload。
[Unit]
StartLimitIntervalSec=0
StartLimitBurst=0
